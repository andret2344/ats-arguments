import io.franzbecker.gradle.lombok.task.DelombokTask

buildscript {
	repositories {
		jcenter()
		maven {
			url "https://plugins.gradle.org/m2/"
		}
	}
	dependencies {
		classpath 'io.franzbecker:gradle-lombok:2.0'
		classpath "org.jfrog.buildinfo:build-info-extractor-gradle:4.13.0"
	}
}

plugins {
	id 'java-library'
	id 'maven-publish'
	id 'java'
	id 'jacoco'
	id 'de.jansauer.printcoverage' version '2.0.0'
}

apply plugin: 'maven-publish'
apply plugin: 'io.franzbecker.gradle-lombok'
apply plugin: 'jacoco'

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

repositories {
	mavenCentral()
	maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
	maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
}

dependencies {
	compileOnly group: 'org.spigotmc', name: 'spigot-api', version: '1.15.2-R0.1-SNAPSHOT'
	compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.12'
	compileOnly group: 'org.jetbrains', name: 'annotations', version: '19.0.0'
	annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.12'

	testCompileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.12'
	testCompileOnly group: 'org.jetbrains', name: 'annotations', version: '19.0.0'
	testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.6.2'
	testImplementation group: 'org.spigotmc', name: 'spigot-api', version: '1.15.2-R0.1-SNAPSHOT'
	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.6.2'
	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-params', version: '5.6.2'
	testImplementation group: 'org.mockito', name: 'mockito-core', version: '3.3.3'
	testImplementation group: 'org.mockito', name: 'mockito-junit-jupiter', version: '3.3.3'
	testAnnotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.12'
}

compileJava.options.compilerArgs << '-parameters' << '-g' << '-Xlint:deprecation' << '-Xlint:unchecked'
compileTestJava.options.compilerArgs << '-parameters' << '-g' << '-Xlint:deprecation' << '-Xlint:unchecked'

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport, printCoverage
}

jacocoTestReport {
	reports.xml.enabled true
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			limit {
				minimum = 0.1
			}
		}
	}
}

javadoc {
	source = sourceSets.main.allJava
	classpath = configurations.compileClasspath

	options {
		setMemberLevel JavadocMemberLevel.PUBLIC
		setAuthor true

		links "https://docs.oracle.com/en/java/javase/11/docs/api/"
	}
}

task sourceJar(type: Jar) {
	classifier 'sources'
	from sourceSets.main.allJava
}

task packageJavadoc(type: Jar) {
	classifier 'javadoc'
	from javadoc
}

publishing {
    publications {
        library(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "https://gitlab.com/api/v4/projects/12063927/packages/maven"
            credentials(HttpHeaderCredentials) {
            	name = 'Job-Token'
            	value = System.getenv("CI_JOB_TOKEN")
            }
            authentication {
                header(HttpHeaderAuthentication)
            }
        }
    }
}


jar {
	setArchivesBaseName "${project.codeName}"
}

task delombok(type: DelombokTask, dependsOn: compileJava) {
	ext.outputDir = file("$buildDir/delombok")
	outputs.dir(outputDir)
	sourceSets.main.java.srcDirs.each {
		inputs.dir(it)
		args(it, "-d", outputDir)
	}
	doFirst {
		outputDir.deleteDir()
	}
}
