import io.franzbecker.gradle.lombok.task.DelombokTask

buildscript {
	repositories {
		jcenter()
		maven { url 'https://plugins.gradle.org/m2/' }
	}
	dependencies { classpath 'io.franzbecker:gradle-lombok:2.0' }
}

plugins {
	id 'de.jansauer.printcoverage' version '2.0.0'
}

apply plugin: 'idea'
apply plugin: 'java'
apply plugin: 'jacoco'
apply plugin: 'maven-publish'

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

repositories {
	mavenCentral()
	maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
}

dependencies {
	compileOnly group: 'org.spigotmc', name: 'spigot-api', version: '1.16.4-R0.1-SNAPSHOT'
	compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.16'
	compileOnly group: 'org.jetbrains', name: 'annotations', version: '20.1.0'
	annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.16'

	testCompileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.16'
	testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.7.0'
	testImplementation group: 'org.spigotmc', name: 'spigot-api', version: '1.16.4-R0.1-SNAPSHOT'
	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.7.0'
	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-params', version: '5.7.0'
	testImplementation group: 'org.mockito', name: 'mockito-core', version: '3.4.6'
	testImplementation group: 'org.mockito', name: 'mockito-junit-jupiter', version: '3.4.6'
	testImplementation group: 'org.mockito', name: 'mockito-inline', version: '3.4.6'
	testAnnotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.16'
}

compileJava.options.compilerArgs << '-parameters' << '-g' << '-Xlint:deprecation' << '-Xlint:unchecked'
compileTestJava.options.compilerArgs << '-parameters' << '-g' << '-Xlint:deprecation' << '-Xlint:unchecked'

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport, printCoverage
}

jacocoTestReport {
	reports.xml.enabled true
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			limit {
				minimum = 1.0
			}
		}
	}
}

javadoc {
	source = sourceSets.main.allJava
	classpath = configurations.compileClasspath

	options {
		setMemberLevel JavadocMemberLevel.PUBLIC
		setAuthor true

		links 'https://docs.oracle.com/en/java/javase/14/docs/api/'
	}
}

task sourceJar(type: Jar) {
	archiveClassifier.set('sources')
	from sourceSets.main.allJava
}

task packageJavadoc(type: Jar) {
	archiveClassifier.set('javadoc')
	from javadoc
}

publishing {
	publications {
		//noinspection GroovyAssignabilityCheck
		library(MavenPublication) {
			from components.java
			artifact tasks.sourceJar
			artifact tasks.packageJavadoc
			groupId = project.group
			version = project.version
			artifactId = project.codeName
		}
	}
	repositories {
		maven {
			url 'https://gitlab.com/api/v4/projects/12063927/packages/maven'
			credentials(HttpHeaderCredentials) {
				name = 'Job-Token'
				value = System.getenv('CI_JOB_TOKEN')
			}
			authentication {
				//noinspection GroovyAssignabilityCheck
				header(HttpHeaderAuthentication)
			}
		}
	}
}

jar {
	setArchivesBaseName "${project.codeName}"
}

task delombok(type: DelombokTask, dependsOn: compileJava) {
	ext.outputDir = file('$buildDir/delombok')
	outputs.dir(outputDir)
	sourceSets.main.java.srcDirs.each {
		inputs.dir(it)
		args(it, '-d', outputDir)
	}
	doFirst {
		outputDir.deleteDir()
	}
}
