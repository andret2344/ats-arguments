plugins {
	id 'org.barfuin.gradle.jacocolog' version '3.1.0'
}

apply plugin: 'idea'
apply plugin: 'java'
apply plugin: 'jacoco'
apply plugin: 'maven-publish'
apply plugin: 'checkstyle'

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

sourceSets {
	integration {
		java.srcDir "$projectDir/src/integration/java"
		resources.srcDir "$projectDir/src/integration/resources"
		compileClasspath += main.output + test.output
		runtimeClasspath += main.output + test.output
	}
}

configurations {
	integrationImplementation.extendsFrom testImplementation
	integrationImplementation.canBeResolved true
	integrationRuntimeOnly.extendsFrom testRuntimeOnly
	integrationRuntimeOnly.canBeResolved true
}

task integrationTest(type: Test) {
	description = 'Runs the integration tests.'
	group = 'verification'
	testClassesDirs = sourceSets.integration.output.classesDirs
	classpath = sourceSets.integration.runtimeClasspath
	outputs.upToDateWhen { false }
	useTestNG()
}

idea {
	module {
		scopes.TEST.plus += [configurations.integrationImplementation, configurations.integrationRuntimeOnly]
	}
}

check.dependsOn integrationTest

repositories {
	mavenCentral()
	maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
}

dependencies {
	compileOnly group: 'org.spigotmc', name: 'spigot-api', version: '1.19.4-R0.1-SNAPSHOT'
	compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.26'
	implementation group: 'org.jetbrains', name: 'annotations', version: '24.0.1'
	annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.26'

	testCompileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.26'
	testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.24.2'
	testImplementation group: 'org.mockito', name: 'mockito-core', version: '5.2.0'
	testImplementation group: 'org.mockito', name: 'mockito-inline', version: '5.2.0'
	testImplementation group: 'org.mockito', name: 'mockito-testng', version: '0.4.31'
	testImplementation group: 'org.spigotmc', name: 'spigot-api', version: '1.19.4-R0.1-SNAPSHOT'
	testImplementation group: 'org.testng', name: 'testng', version: '7.7.1'
	testAnnotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.26'
}

compileJava.options.compilerArgs << '-parameters' << '-g' << '-Xlint:deprecation' << '-Xlint:unchecked' << '--release 11'
compileTestJava.options.compilerArgs << '-parameters' << '-g' << '-Xlint:deprecation' << '-Xlint:unchecked' << '--release 11'

checkstyleMain.exclude('example/**.java')
checkstyleTest.exclude('**')
checkstyleIntegration.exclude("**")

test {
	useTestNG()
	finalizedBy jacocoTestCoverageVerification, jacocoAggregatedReport
}

jacocoTestReport {
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: ['example/**'])
		}))
	}
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			limit {
				minimum = 1.0
			}
			excludes = ['example*', 'eu.andret.arguments.example.*']
		}
	}
}

javadoc {
	source = sourceSets.main.allJava
	classpath = configurations.compileClasspath

	options {
		setMemberLevel JavadocMemberLevel.PROTECTED
		setAuthor true

		links 'https://docs.oracle.com/en/java/javase/11/docs/api/'
	}
}

task sourceJar(type: Jar) {
	archiveClassifier.set('sources')
	from sourceSets.main.allJava
}

task packageJavadoc(type: Jar) {
	archiveClassifier.set('javadoc')
	from javadoc
}

publishing {
	publications {
		//noinspection GroovyAssignabilityCheck
		library(MavenPublication) {
			from components.java
			artifact tasks.sourceJar
			artifact tasks.packageJavadoc
			groupId = project.group
			version = project.version
			artifactId = project.codeName
		}
	}
	repositories {
		maven {
			url 'https://gitlab.com/api/v4/projects/12063927/packages/maven'
			credentials(HttpHeaderCredentials) {
				name = 'Job-Token'
				value = System.getenv('CI_JOB_TOKEN')
			}
			authentication {
				//noinspection GroovyAssignabilityCheck
				header(HttpHeaderAuthentication)
			}
		}
	}
}

jar {
	setArchivesBaseName "${project.codeName}"
}
