buildscript {
	dependencies { classpath 'com.github.jengelman.gradle.plugins:shadow:2.0.1' }
}

plugins {
	id 'com.github.johnrengelman.shadow' version '5.2.0'
	id 'kr.entree.spigradle' version '2.2.3'
}

apply plugin: 'idea'
apply plugin: 'java'
apply plugin: 'com.github.johnrengelman.shadow'

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

repositories {
	mavenCentral()
	mavenLocal()
	spigot()
}

dependencies {
	implementation rootProject
	compileOnly group: 'org.spigotmc', name: 'spigot-api', version: '1.17-R0.1-SNAPSHOT'
}

compileJava.options.compilerArgs << '-parameters' << '-g' << '-Xlint:deprecation' << '-Xlint:unchecked'

shadowJar {
	dependencies {
		rootProject
	}
}

build {
	dependsOn shadowJar
}

spigot {
	authors = ['Andret']
	apiVersion = '1.16'

	commands {
		test {
			description = 'The main command.'
			usage = '/<command>'
		}
		parameters {
			description = 'Parameters command'
			usage = '/<command>'
		}
	}
}
