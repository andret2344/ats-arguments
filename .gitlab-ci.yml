image: gradle:8.5-jdk17

before_script:
  - chmod a+x gradlew

stages:
  - build
  - verify
  - publish

compile:
  stage: build
  script:
    - ./gradlew assemble
  artifacts:
    paths:
      - build/classes/**
      - build/libs/*.jar

tests:unit:
  stage: verify
  script:
    - ./gradlew test
  coverage: '/    - Instruction Coverage: ([0-9.]+)%/'
  artifacts:
    reports:
      junit: build/test-results/test/**.xml

tests:int:
  stage: verify
  script:
    - ./gradlew integrationTest

lint:
  stage: verify
  script:
    - ./gradlew checkstyleMain

deploy:
  stage: publish
  script:
    - ./gradlew clean
    - ./gradlew publish
  only:
    - master
  when: manual

pages:
  stage: publish
  script:
    - ./gradlew javadoc
  after_script:
    - mv build/docs/javadoc/ public/
  artifacts:
    paths:
      - public/**
  only:
    - master
  when: manual
