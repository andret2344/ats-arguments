image: frekele/gradle

stages:
  - prepare
  - test
  - publish

compile:
  stage: prepare
  script:
    - gradle compileJava

delombok:
  stage: prepare
  script:
    - gradle delombok
  artifacts:
    paths:
      - ./build/delombok/**

junit:
  stage: test
  script:
    - gradle test
  when: on_success
  artifacts:
    reports:
      junit: build/test-results/test/**.xml
    paths:
      - build/reports/**

artifactory:
  stage: publish
  before_script:
    - curl -fL https://getcli.jfrog.io | sh
    - ./jfrog rt config --url=$ARTIFACTORY_URL --user=$ARTIFACTORY_USER --password=$ARTIFACTORY_PASS
    - ./jfrog rt c show
    - sed -i 's,GRADLE_REPO_KEY,'"$GRADLE_REPO_KEY"',g' configuration.yaml
  script:
    - gradle clean
    - gradle artifactoryPublish -Pusername=$ARTIFACTORY_USER -Ppassword=$ARTIFACTORY_PASS
  only:
    - master
  when: manual
  
pages:
  stage: publish
  dependencies:
    - junit
  script:
    - mv build/test-results/ public/ 
  artifacts:
    paths:
      - public
    expire_in: 30 days
  #only:
  #  - master
