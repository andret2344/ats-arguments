image: gradle:jdk11

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle
  - ls -laF
  - chmod a+x .gradle

stages:
  - prepare
  - build
  - test
  - deploy

wrapper:
  stage: prepare
  script:
    - gradle wrapper

compile:
  stage: build
  dependencies:
    - wrapper
  script:
    - ./gradlew assemble
  artifacts:
    paths:
      - build/classes/**
      - build/libs/*.jar

delombok:
  stage: build
  dependencies:
    - wrapper
  script:
    - ./gradlew delombok
  artifacts:
    paths:
      - build/delombok/**

junit:
  stage: test
  dependencies:
    - compile
  script:
    - ./gradlew check
  coverage: '/^Coverage:\s(\d+\.\d+%)/'
  when: on_success
  artifacts:
    reports:
      junit: build/test-results/test/**.xml

publish:
  stage: deploy
  script:
    - ./gradlew clean
    - ./gradlew publish
  only:
    - master
  when: manual

javadoc:
  stage: deploy
  script:
    - ./gradlew javadoc
  after_script:
    - mv build/docs/javadoc/ public/
  artifacts:
    paths:
      - public/**
  only:
    - master
