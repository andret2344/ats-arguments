[versions]
java = "25"
spigot = "26.3-R0.1-SNAPSHOT"
jetbrains-annotations = "26.1.0"
assertj = "3.27.7"
mockito = "5.24.0"
mockito-testng = "0.5.4"
testng = "7.12.0"
jacoco = "0.8.15"
checkstyle = "14.3.0"

[libraries]
spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-testng = { module = "org.mockito:mockito-testng", version.ref = "mockito-testng" }
testng = { module = "org.testng:testng", version.ref = "testng" }

[plugins]
jacocolog = { id = "org.barfuin.gradle.jacocolog", version = "4.0.2" }
changelog = { id = "org.jetbrains.changelog", version = "2.5.0" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
spigradle = { id = "io.typst.spigradle.spigot", version = "4.0.2" }
